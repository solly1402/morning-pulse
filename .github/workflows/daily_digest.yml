name: ☕ Morning Pulse Daily Digest

on:
  schedule:
    # Chạy tự động vào 22:45 UTC mỗi ngày = 05:45 sáng giờ Việt Nam (GMT+7)
    - cron: "45 22 * * *"
  workflow_dispatch: # Cho phép bấm nút "Run workflow" chạy thử bất cứ lúc nào trên GitHub

permissions:
  contents: write # Cấp quyền để GitHub Actions tự động commit file Daily Digest vào repo

jobs:
  send-morning-digest:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Morning Pulse Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: 📝 Commit & Push Daily Digest to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --staged --quiet; then
            echo "Không có thay đổi mới trong thư mục digests/."
          else
            git commit -m "📰 docs(digest): cập nhật bản tin sáng $(date -u -d '+7 hours' +'%Y-%m-%d')"
            git push
          fi
