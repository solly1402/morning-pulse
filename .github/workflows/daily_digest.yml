name: ☕ Morning Pulse Daily Digest

on:
  # 🎯 NGUỒN KÍCH HOẠT CHÍNH: cron-job.org gọi API workflow_dispatch đúng 05:45 sáng giờ VN
  #    (gửi kèm input trigger_source=cronjob). Chạy thử bằng tay trên GitHub thì để mặc định "manual".
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Nguồn kích hoạt (cronjob = lịch hằng ngày, manual = chạy thử ngay)"
        required: false
        default: "manual"
        type: choice
        options:
          - manual
          - cronjob

  # 🛟 LƯỚI AN TOÀN: phòng khi cron-job.org gặp sự cố, GitHub sẽ tự chạy bù.
  #    (Cron của GitHub có thể trễ 1-4 tiếng nên chỉ dùng làm dự phòng.)
  schedule:
    - cron: "30 23 * * *" # 06:30 VN

permissions:
  contents: write # Cấp quyền để GitHub Actions tự động commit file Daily Digest vào repo

# Chỉ cho phép 1 lượt chạy tại một thời điểm, lượt sau xếp hàng chờ lượt trước xong
concurrency:
  group: morning-pulse-daily
  cancel-in-progress: false

jobs:
  send-morning-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository (bản mới nhất của nhánh main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🛡️ Kiểm tra hôm nay đã gửi bản tin chưa
        id: guard
        run: |
          TODAY_VN=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)
          LAST_SENT=$(cat digests/.last_sent 2>/dev/null || echo "none")
          SOURCE="${{ github.event_name }}/${{ inputs.trigger_source || 'none' }}"
          echo "Nguồn kích hoạt: $SOURCE | Hôm nay (VN): $TODAY_VN | Lần gửi gần nhất: $LAST_SENT"
          if [ "${{ inputs.trigger_source }}" = "manual" ]; then
            echo "🧪 Chạy thử bằng tay -> luôn gửi."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$LAST_SENT" = "$TODAY_VN" ]; then
            echo "✅ Bản tin hôm nay đã được gửi rồi, bỏ qua lượt chạy này."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🐍 Set up Python 3.12
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Morning Pulse Bot
        if: steps.guard.outputs.skip == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: 📝 Commit & Push Daily Digest + đánh dấu đã gửi
        if: steps.guard.outputs.skip == 'false'
        run: |
          TODAY_VN=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)
          echo "$TODAY_VN" > digests/.last_sent
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --staged --quiet; then
            echo "Không có thay đổi mới trong thư mục digests/."
          else
            git commit -m "📰 docs(digest): cập nhật bản tin sáng $TODAY_VN"
            git pull --rebase origin main || true
            git push
          fi
