# Cấu hình chung cho Morning Pulse
app:
  name: "Morning Pulse ☕"
  timezone: "Asia/Ho_Chi_Minh"
  language: "vi"

# Cấu hình AI Summarizer
ai:
  enabled: true
  provider: "gemini" # "gemini" hoặc "openai" (hỗ trợ cả Groq, OpenRouter)
  gemini_model: "gemini-3-flash-preview"
  gemini_fallback_models:
    - "gemini-3.5-flash-lite"
    - "gemini-3.6-flash"
    - "gemini-3.1-flash-lite-preview"
  temperature: 0.35

# Cấu hình các nguồn tin
sources:
  github_trending:
    enabled: true
    since: "daily" # daily, weekly, monthly
    spoken_language: "" # để trống lấy toàn cầu, hoặc "en", "vi"
    programming_languages:
      - "" # Tất cả ngôn ngữ
    limit: 5

  hacker_news:
    enabled: true
    limit: 5

  reddit:
    enabled: true
    limit_per_sub: 2
    subreddits:
      - "programming"
      - "technology"
      - "LocalLLaMA"
      - "soccer"

  tech_news:
    enabled: true
    limit_per_feed: 2
    feeds:
      - name: "TechCrunch"
        url: "https://techcrunch.com/feed/"
      - name: "The Verge"
        url: "https://www.theverge.com/rss/index.xml"
      - name: "VnExpress Số Hóa"
        url: "https://vnexpress.net/rss/so-hoa.rss"

  football:
    enabled: true
    limit_per_feed: 2
    favorite_teams:
      - name: "Manchester United"
        league: "eng.1"
        team_id: "360"
        emoji: "👹"
      - name: "Real Madrid"
        league: "esp.1"
        team_id: "86"
        emoji: "👑"
      - name: "Arsenal"
        league: "eng.1"
        team_id: "359"
        emoji: "🔫"
      - name: "Barcelona"
        league: "esp.1"
        team_id: "83"
        emoji: "🔵🔴"
    feeds:
      - name: "BBC Sport Football"
        url: "https://feeds.bbci.co.uk/sport/football/rss.xml"
      - name: "The Guardian Football"
        url: "https://www.theguardian.com/football/rss"
      - name: "VnExpress Thể Thao"
        url: "https://vnexpress.net/rss/the-thao.rss"

# Cấu hình đầu ra
outputs:
  markdown_archive:
    enabled: true
    directory: "digests"
  telegram:
    enabled: true
  discord:
    enabled: true
